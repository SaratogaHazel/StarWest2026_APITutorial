openapi: 3.0.3

info:
  title: StarWest 2026 E-Commerce API
  version: 1.0.0
  description: |
    An in-memory e-commerce REST API demonstrating JWT authentication and a
    rules-driven checkout.

    **Checkout rules**
    - Only `cash` and `credit_card` are accepted as payment methods.
    - `cash` orders receive a 10% discount.
    - Only authenticated users can check out.

    All data lives in memory and resets when the server restarts.
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Service liveness
  - name: Authentication
    description: Registration and login
  - name: Checkout
    description: Order pricing for authenticated users

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Healthcheck
      description: Reports that the API is running. No authentication required.
      operationId: healthcheck
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: Creates a user in the in-memory store. The new user can log in immediately.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Dave Lee
              email: dave@example.com
              password: Password123
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: That email is already registered.

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      description: |
        Exchanges email and password for a JWT. Send the token as
        `Authorization: Bearer <token>` when calling the checkout endpoint.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: Password123
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.

  /api/checkout:
    post:
      tags: [Checkout]
      summary: Check out a cart
      description: |
        Prices a cart for the authenticated user.

        - `paymentMethod` must be `cash` or `credit_card`.
        - `cash` applies a 10% discount to the subtotal.
        - A valid Bearer token is required.
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              cash:
                summary: Cash payment (10% discount)
                value:
                  paymentMethod: cash
                  items:
                    - productId: 1
                      quantity: 2
                    - productId: 2
                      quantity: 1
              creditCard:
                summary: Credit card payment (no discount)
                value:
                  paymentMethod: credit_card
                  items:
                    - productId: 3
                      quantity: 1
      responses:
        '201':
          description: Order priced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
              example:
                orderId: 6f1b0f3a-2a4c-4d5e-9c1b-0e2a7d8f4c11
                userId: 1
                items:
                  - productId: 1
                    name: Wireless Mouse
                    unitPrice: 25.5
                    quantity: 2
                    lineTotal: 51
                  - productId: 2
                    name: Mechanical Keyboard
                    unitPrice: 89.99
                    quantity: 1
                    lineTotal: 89.99
                paymentMethod: cash
                subtotal: 140.99
                discountRate: 0.1
                discount: 14.1
                total: 126.89
                currency: USD
                createdAt: '2026-09-22T17:04:11.512Z'
        '400':
          description: Invalid payload or an unsupported payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_PAYMENT_METHOD
                  message: 'paymentMethod must be one of: cash, credit_card.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: One of the requested products does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: PRODUCT_NOT_FOUND
                  message: No product found with id 99.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the `token` returned by `POST /api/auth/login`.

  responses:
    BadRequest:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: email and password are required.
    Unauthorized:
      description: A valid Bearer token was not supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: MISSING_TOKEN
              message: Authorization header with a Bearer token is required.

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          format: double
          description: Seconds the process has been running.
          example: 12.47
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Alice Johnson
        email:
          type: string
          format: email
          example: alice@example.com

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Dave Lee
        email:
          type: string
          format: email
          example: dave@example.com
        password:
          type: string
          minLength: 6
          example: Password123

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully.
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: Password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT to send as `Authorization: Bearer <token>`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 1h
        user:
          $ref: '#/components/schemas/User'

    CheckoutItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    CheckoutRequest:
      type: object
      required: [paymentMethod, items]
      properties:
        paymentMethod:
          type: string
          enum: [cash, credit_card]
          description: '`cash` receives a 10% discount.'
          example: cash
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItemRequest'

    CheckoutItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Mouse
        unitPrice:
          type: number
          format: double
          example: 25.5
        quantity:
          type: integer
          example: 2
        lineTotal:
          type: number
          format: double
          example: 51
      description: unitPrice multiplied by quantity gives lineTotal.

    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        userId:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
        paymentMethod:
          type: string
          enum: [cash, credit_card]
        subtotal:
          type: number
          format: double
          example: 140.99
        discountRate:
          type: number
          format: double
          description: 0.1 for cash orders, 0 otherwise.
          example: 0.1
        discount:
          type: number
          format: double
          example: 14.1
        total:
          type: number
          format: double
          description: subtotal minus discount.
          example: 126.89
        currency:
          type: string
          example: USD
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: VALIDATION_ERROR
            message:
              type: string
              example: email and password are required.
